# ===========================================================================
# Documenso for TerraMaster TOS 7 (multi-container Docker application)
# ===========================================================================
# App image : documenso/documenso:v2.22.0 (Docker Hub, the official upstream
#             image, used unmodified; amd64 only)
# Database  : postgres:16-alpine (internal only)
#
# Only the app publishes a host port. The wrapper generates the NextAuth
# secret, the data-encryption keys and a self-signed signing certificate on
# first start and keeps them on the persistent data volume.

services:
  documensodocker:
    image: documenso/documenso:v2.22.0
    container_name: documensodocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        @@ENTRYPOINT_SH@@
    depends_on:
      documensodocker-db:
        condition: service_healthy
    ports:
      - "8155:3000"
    environment:
      TZ: "Asia/Shanghai"
      # The TOS installer does not substitute placeholders inside compose files, so the
      # URL cannot be templated here; relative redirects keep the UI reachable from
      # any LAN address. Change it to your NAS URL if you rely on email links.
      NEXT_PUBLIC_WEBAPP_URL: "http://localhost:8155"
      NEXT_PRIVATE_DATABASE_URL: "postgresql://documenso@documensodocker-db:5432/documenso"
      NEXT_PRIVATE_DIRECT_DATABASE_URL: "postgresql://documenso@documensodocker-db:5432/documenso"
      NEXT_PUBLIC_UPLOAD_TRANSPORT: "database"
      DOCUMENSO_DISABLE_TELEMETRY: "true"
    volumes:
      - /Volume1/DockerAppData/documensodocker/data:/data
    healthcheck:
      # /api/health reports the database and the signing certificate, so a
      # half-migrated instance is never marked healthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  documensodocker-db:
    image: postgres:16-alpine
    container_name: documensodocker-db
    restart: unless-stopped
    user: "1000:1000"
    environment:
      TZ: "Asia/Shanghai"
      POSTGRES_USER: "documenso"
      POSTGRES_DB: "documenso"
      POSTGRES_HOST_AUTH_METHOD: "trust"
      PGDATA: "/var/lib/postgresql/data/pgdata"
    volumes:
      - /Volume1/DockerAppData/documensodocker/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso -d documenso"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
x-app-meta:
  web:
    port: 8155
    protocol: http
